<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رفع الرسم 🎨</title>

<style>
body{
  margin:0;
  background:#020a2a;
  color:white;
  font-family:Arial;
  text-align:center;
  padding:20px;
}

input, button{
  margin:10px;
  padding:12px;
  border:none;
  border-radius:15px;
}

.upload{
  background:#00cc66;
  color:white;
  cursor:pointer;
  font-weight:bold;
}

.card{
  background:#06124d;
  margin:15px auto;
  padding:15px;
  border-radius:20px;
  width:90%;
}

img{
  width:100%;
  border-radius:15px;
}
</style>
</head>

<body>

<h2>🎨 ارفع رسمتك</h2>

<input type="text" id="name" placeholder="اسمك">
<br>
<input type="file" id="file">
<br>

<button class="upload" onclick="upload()">رفع</button>

<h2>📌 الرسمات</h2>
<div id="gallery"></div>

<script>

// 👇 حط بياناتك هنا
const cloudName = "dpfp1atqv";
const uploadPreset = "drawing_upload";

function upload(){

  let file = document.getElementById("file").files[0];
  let name = document.getElementById("name").value;

  if(!file || !name){
    alert("اكتب اسمك واختر صورة 😼");
    return;
  }

  let formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", uploadPreset);

  fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, {
    method:"POST",
    body:formData
  })
  .then(res => res.json())
  .then(data => {

    if(data.error){
      alert("خطأ: " + data.error.message);
      return;
    }

    let div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <h3>${name}</h3>
      <img src="${data.secure_url}">
    `;

    document.getElementById("gallery").appendChild(div);

  });

}

</script>

</body>
</html>
