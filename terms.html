<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>الشروط</title>

<style>
body{
  background:#020a2a;
  color:white;
  font-family:Arial;
  text-align:center;
  padding:40px;
}

.condition{
  margin:20px auto;
  padding:20px;
  width:80%;
  background:#06124d;
  border-radius:25px;
}

.accept-btn{
  margin-top:10px;
  padding:8px 15px;
  background:gray;
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
  transition:0.5s;
}

.accepted{
  background:linear-gradient(to right,#00ff88,#00aa44);
}

#submitBtn{
  margin-top:40px;
  padding:20px 60px;
  font-size:22px;
  border:none;
  border-radius:60px;
  background:gray;
  color:white;
  cursor:not-allowed;
  transition:0.4s;
}

#submitBtn.active{
  background:#007bff;
  cursor:pointer;
}
</style>
</head>

<body>

<h2>الشروط و الأحكام</h2>

<div class="condition">
الرسم يكون فقط بالكونتري بول او كونتري هيومن و عادي تسوي رسمة عن اصدقائك
<br>
<button class="accept-btn" onclick="accept(this)">موافقة</button>
</div>

<div class="condition">
عدم سرقة الرسمة
<br>
<button class="accept-btn" onclick="accept(this)">موافقة</button>
</div>

<div class="condition">
عدم نسخ فكرة احد (يمكنك رؤية الرسمات الاخرى)
<br>
<button class="accept-btn" onclick="accept(this)">موافقة</button>
</div>

<div class="condition">
عدم الاستياء اذا خسرت او لم يعجبك التقييم
<br>
<button class="accept-btn" onclick="accept(this)">موافقة</button>
</div>

<div class="condition">
يرجى ارسال الرسمات في الموقع فقط
<br>
<button class="accept-btn" onclick="accept(this)">موافقة</button>
</div>

<div class="condition">
عدم مخالفة الشروط و الاحكام
<br>
<button class="accept-btn" onclick="accept(this)">موافقة</button>
</div>

<button id="submitBtn" disabled onclick="go()">المشاركة</button>

<script>
let total = 6;
let count = 0;

function accept(btn){
  if(!btn.classList.contains("accepted")){
    btn.classList.add("accepted");
    count++;
  }

  if(count === total){
    let submit = document.getElementById("submitBtn");
    submit.disabled = false;
    submit.classList.add("active");
  }
}

function go(){
  window.location.href = "rsm.html";
}
</script>

</body>
</html>
