<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>الشروط والأحكام</title>

<style>
body{
  background:#111;
  color:white;
  font-family:Arial;
  text-align:center;
}

.condition{
  margin:15px;
  padding:10px;
  border:1px solid #444;
  border-radius:10px;
}

button{
  padding:8px 15px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.accept{
  background:#00aa00;
  color:white;
}

#submitBtn{
  background:gray;
  color:white;
  margin-top:30px;
  padding:12px 25px;
  font-size:18px;
}
</style>
</head>

<body>

<h2>الشروط و الأحكام</h2>

<div class="condition">
الرسم يكون فقط بالكونتري بول او كونتري هيومن و عادي تسوي رسمة عن اصدقائك
<br>
<button class="accept" onclick="accept(this)">قبول الشروط</button>
</div>

<div class="condition">
عدم سرقة الرسمة
<br>
<button class="accept" onclick="accept(this)">قبول الشروط</button>
</div>

<div class="condition">
عدم نسخ فكرة احد (يمكنك رؤية الرسمات الاخرى)
<br>
<button class="accept" onclick="accept(this)">قبول الشروط</button>
</div>

<div class="condition">
عدم الاستياء اذا خسرت او لم يعجبك التقييم
<br>
<button class="accept" onclick="accept(this)">قبول الشروط</button>
</div>

<div class="condition">
يرجى ارسال الرسمات في الموقع فقط
<br>
<button class="accept" onclick="accept(this)">قبول الشروط</button>
</div>

<div class="condition">
عدم مخالفة الشروط و الاحكام
<br>
<button class="accept" onclick="accept(this)">قبول الشروط</button>
</div>

<button id="submitBtn" disabled onclick="goToUpload()">المشاركة</button>

<script>
let acceptedCount = 0;
const total = 6;

function accept(btn){
  if(!btn.classList.contains("done")){
    btn.classList.add("done");
    btn.style.background = "blue";
    btn.innerText = "تم القبول ✓";
    acceptedCount++;
  }

  if(acceptedCount === total){
    document.getElementById("submitBtn").disabled = false;
    document.getElementById("submitBtn").style.background = "blue";
  }
}

function goToUpload(){
  window.location.href = "rsm.html";
}
</script>

</body>
</html>
