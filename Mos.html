<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسابقة الرسم</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#020617; /* ازرق داكن جدا جدا */
    font-family:Arial;
}

button{
    background:white;
    color:#020617;
    padding:25px 60px;
    font-size:22px;
    border:none;
    border-radius:60px; /* حواف دائرية جدا */
    cursor:pointer;
    font-weight:bold;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}
</style>
</head>

<body>

<button>قراءة الشروط و الأحكام</button>

</body>
</html>
